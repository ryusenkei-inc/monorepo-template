# main 行きの PR の検査。中身は toolkit の再利用可能なワークフロー（main への push では実行しない）
name: CI

on:
  pull_request:
    branches: [main]
    # タイトルの変更（edited）は pr-title.yaml
    types: [opened, synchronize, reopened]

# 同じ PR の新しい実行が来たら古い実行を中止
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    uses: ryusenkei-inc/toolkit/.github/workflows/reusable-ci.yaml@main
