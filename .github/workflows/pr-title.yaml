# main 行きの PR のタイトルの変更の再検査。中身は toolkit の再利用可能なワークフロー
name: PR title

on:
  pull_request:
    branches: [main]
    types: [edited]

concurrency:
  group: pr-title-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  title:
    uses: ryusenkei-inc/toolkit/.github/workflows/reusable-pr-title.yaml@main
